
#Add Pre-mirrors of tool
SOURCE_MIRROR_URL = "file:///opt/petalinux/2019.1/components/yocto/downloads/"

#Add Pre-mirrors from petalinux-config
PREMIRRORS = " git://.*/.* http://petalinux.xilinx.com/sswreleases/rel-v2019/downloads \n \
ftp://.*/.* http://petalinux.xilinx.com/sswreleases/rel-v2019/downloads \n \
http://.*/.* http://petalinux.xilinx.com/sswreleases/rel-v2019/downloads \n \
https://.*/.* http://petalinux.xilinx.com/sswreleases/rel-v2019/downloads \n"


#Sttate mirror settings
SSTATE_MIRRORS = "file://universal/(.*) file:///opt/petalinux/2019.1/components/yocto/source/arm/sstate-cache/universal-4.8/\1\n"
SSTATE_MIRRORS .= "\nfile://.* file:///opt/petalinux/2019.1/components/yocto/source/arm/sstate-cache/PATH\n"
# Remote SSTATE mirror is unreachable/slow in this build environment; use the
# local PetaLinux sstate cache only. Restore this block for online builds.
#SSTATE_MIRRORS_append = "  \
#file://.* http://petalinux.xilinx.com/sswreleases/rel-v2019/arm/sstate-cache/PATH;downloadfilename=PATH \n \
#"

SIGGEN_UNLOCKED_RECIPES += "arm-trusted-firmware busybox init-ifupdown python3"
UNINATIVE_DLDIR = "/opt/petalinux/2019.1/components/yocto/source/arm/downloads/uninative"



MACHINE = "plnx-zynq7"
PACKAGE_CLASSES = "package_rpm"
DL_DIR = "${TOPDIR}/downloads"
SSTATE_DIR = "${TOPDIR}/sstate-cache"
XILINX_SDK_TOOLCHAIN = "/opt/petalinux/2019.1/tools/xsct"
USE_XSCT_TARBALL = "0"
IMAGE_LINGUAS = " "
TMPDIR = "/workspace/sdk/CanFD/zmht_canfd/build/tmp"
hostname_pn-base-files = "zmht_canfd"
PETALINUX_PRODUCT_pn-base-files = "zmht_canfd"
PETALINUX_VERSION_pn-base-files = "1.00"

BB_NUMBER_THREADS = "2"
PARALLEL_MAKE = "-j 2"






# Add system HDF/DSA
HDF_EXT_forcevariable = "hdf"
HDF_BASE_forcevariable = "file://"
HDF_PATH_forcevariable = "/workspace/sdk/CanFD/zmht_canfd/project-spec/hw-description/system.hdf"

#Add Kernel image
KERNEL_IMAGETYPE = "zImage"
UIMAGE_LOADADDR = "0x8000"
KERNEL_ALT_IMAGETYPE = "uImage"

#Add FIT Variables
KERNEL_CLASSES += "kernel-fitimage"
KERNEL_IMAGETYPES += "fitImage vmlinux"
UBOOT_ENTRYPOINT  = "0x8000"
UBOOT_LOADADDRESS = "0x8000"

EXTRA_IMAGEDEPENDS_remove = ""
UBOOT_MACHINE_forcevariable = "zynq_zc702_config"
HAS_PLATFORM_INIT_append += "zynq_zc702_config"

INITRAMFS_IMAGE_BUNDLE = "1"
INITRAMFS_IMAGE = "petalinux-user-image"
INITRAMFS_MAXSIZE = "524288"

SERIAL_CONSOLE_forcevariable = "115200 ttyPS0"
